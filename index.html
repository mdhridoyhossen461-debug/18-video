<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hriday Video</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 16px;
      text-align: center;
      background: #181818;
      font-size: 20px;
      font-weight: bold;
    }

    .container {
      padding: 15px;
    }

    .admin {
      background: #1d1d1d;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    input,
    button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border: 0;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      background: #168cff;
      color: white;
      font-weight: bold;
    }

    button:active {
      opacity: .8;
    }

    #uploadBox {
      display: none;
    }

    .video {
      background: #1b1b1b;
      margin-bottom: 18px;
      border-radius: 12px;
      overflow: hidden;
    }

    iframe {
      width: 100%;
      aspect-ratio: 16 / 9;
      border: 0;
      display: block;
    }

    .title {
      padding: 12px;
      font-weight: bold;
    }

    .message {
      text-align: center;
      padding: 20px;
      color: #aaa;
    }
  </style>
</head>

<body>

<header>🎬 Hriday Video</header>

<div class="container">

  <!-- ADMIN -->
  <div class="admin">

    <button onclick="showAdmin()">🔐 Admin Login</button>

    <div id="uploadBox">

      <input
        type="password"
        id="adminPassword"
        placeholder="Admin Password">

      <button onclick="login()">Login</button>

      <div id="uploadArea" style="display:none;">

        <input
          type="text"
          id="videoId"
          placeholder="Bunny Video ID">

        <input
          type="text"
          id="videoTitle"
          placeholder="ভিডিওর নাম">

        <button onclick="addVideo()">
          ➕ ভিডিও যোগ করুন
        </button>

      </div>

    </div>

  </div>

  <!-- VIDEOS -->
  <div id="videos">
    <div class="message">
      ভিডিও লোড হচ্ছে...
    </div>
  </div>

</div>

<script>

const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

/*
  আপনার Bunny Library
*/
const LIBRARY_ID = "742266";

/*
  আপনার বর্তমান ভিডিও
*/
const videos = [
  {
    id: "50ccb81c-0869-4195-a9f3-6b75fe1dc137",
    title: "ভিডিও ১"
  }
];

function showAdmin() {
  document.getElementById("uploadBox").style.display = "block";
}

function login() {

  const password =
    document.getElementById("adminPassword").value;

  /*
    এটি শুধু DEMO login.
    আসল নিরাপদ login পরে server-side করতে হবে।
  */

  if (password === "123456") {

    document.getElementById("uploadArea")
      .style.display = "block";

    alert("Admin Login সফল হয়েছে");

  } else {

    alert("Password ভুল");

  }
}

function addVideo() {

  const id =
    document.getElementById("videoId").value.trim();

  const title =
    document.getElementById("videoTitle").value.trim();

  if (!id) {
    alert("Bunny Video ID দিন");
    return;
  }

  videos.unshift({
    id: id,
    title: title || "নতুন ভিডিও"
  });

  renderVideos();

  document.getElementById("videoId").value = "";
  document.getElementById("videoTitle").value = "";

  alert("ভিডিও যোগ হয়েছে");

}

function renderVideos() {

  const box =
    document.getElementById("videos");

  box.innerHTML = "";

  videos.forEach(video => {

    const div =
      document.createElement("div");

    div.className = "video";

    div.innerHTML = `
      <iframe
        src="https://iframe.mediadelivery.net/embed/${LIBRARY_ID}/${video.id}"
        loading="lazy"
        allow="accelerometer; gyroscope; autoplay; encrypted-media; picture-in-picture;"
        allowfullscreen>
      </iframe>

      <div class="title">
        ${escapeHtml(video.title)}
      </div>
    `;

    box.appendChild(div);

  });

}

function escapeHtml(text) {

  const div =
    document.createElement("div");

  div.textContent = text;

  return div.innerHTML;

}

renderVideos();

</script>

</body>
</html>

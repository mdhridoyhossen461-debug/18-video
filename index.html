<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hriday Video</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 16px;
      text-align: center;
      background: #181818;
      font-size: 20px;
      font-weight: bold;
    }

    .container {
      padding: 12px;
    }

    .video {
      background: #1b1b1b;
      margin-bottom: 18px;
      border-radius: 12px;
      overflow: hidden;
    }

    iframe {
      width: 100%;
      aspect-ratio: 16 / 9;
      border: 0;
      display: block;
    }

    .title {
      padding: 12px;
      font-weight: bold;
    }

    .message {
      text-align: center;
      padding: 20px;
      color: #aaa;
    }
  </style>
</head>

<body>

<header>🎬 Hriday Video</header>

<div class="container">

  <div id="videos">
    <div class="message">ভিডিও লোড হচ্ছে...</div>
  </div>

</div>

<script>

const tg = window.Telegram.WebApp;

tg.ready();
tg.expand();

const LIBRARY_ID = "742266";

const videos = [
  {
    id: "50ccb81c-0869-4195-a9f3-6b75fe1dc137",
    title: "ভিডিও ১"
  }
];

function renderVideos() {

  const box = document.getElementById("videos");

  box.innerHTML = "";

  videos.forEach(video => {

    const div = document.createElement("div");

    div.className = "video";

    div.innerHTML = `
      <iframe
        src="https://iframe.mediadelivery.net/embed/${LIBRARY_ID}/${video.id}"
        loading="lazy"
        allow="accelerometer; gyroscope; autoplay; encrypted-media; picture-in-picture;"
        allowfullscreen>
      </iframe>

      <div class="title">
        ${escapeHtml(video.title)}
      </div>
    `;

    box.appendChild(div);

  });
}

function escapeHtml(text) {

  const div = document.createElement("div");

  div.textContent = text;

  return div.innerHTML;
}

renderVideos();

</script>

</body>
</html>

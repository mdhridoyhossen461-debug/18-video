<!DOCTYPE html><html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hriday Video</title>  <script src="https://telegram.org/js/telegram-web-app.js"></script>  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 16px;
      text-align: center;
      background: #181818;
      font-size: 20px;
      font-weight: bold;
    }

    .container {
      padding: 12px;
    }

    .upload-box {
      background: #1b1b1b;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    input[type="file"] {
      width: 100%;
      padding: 12px;
      background: #292929;
      color: white;
      border-radius: 8px;
      margin-bottom: 10px;
    }

    button {
      width: 100%;
      padding: 13px;
      border: 0;
      border-radius: 8px;
      background: #2196f3;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }

    button:disabled {
      background: #555;
    }

    #status {
      text-align: center;
      padding: 10px;
      color: #aaa;
    }

    .video {
      background: #1b1b1b;
      margin-bottom: 18px;
      border-radius: 12px;
      overflow: hidden;
    }

    iframe {
      width: 100%;
      aspect-ratio: 16 / 9;
      border: 0;
      display: block;
    }

    .title {
      padding: 12px;
      font-weight: bold;
    }

    .message {
      text-align: center;
      padding: 20px;
      color: #aaa;
    }
  </style></head><body><header>🎬 Hriday Video</header><div class="container">  <div class="upload-box">
    <input type="file" id="videoFile" accept="video/*"><button id="uploadBtn" onclick="uploadVideo()">
  📤 ভিডিও Upload করুন
</button>

<div id="status"></div>

  </div>  <div id="videos">
    <div class="message">ভিডিও লোড হচ্ছে...</div>
  </div></div><script>

const tg = window.Telegram.WebApp;

tg.ready();
tg.expand();

const API_URL =
  "https://winter-haze-4463.mdhridoyhossen461.workers.dev";

const LIBRARY_ID = "742266";

const videos = [
  {
    id: "50ccb81c-0869-4195-a9f3-6b75fe1dc137",
    title: "ভিডিও ১"
  }
];

async function uploadVideo() {

  const fileInput = document.getElementById("videoFile");
  const button = document.getElementById("uploadBtn");
  const status = document.getElementById("status");

  if (!fileInput.files.length) {
    status.textContent = "❌ আগে একটি ভিডিও নির্বাচন করুন";
    return;
  }

  const file = fileInput.files[0];

  if (!file.type.startsWith("video/")) {
    status.textContent = "❌ শুধুমাত্র ভিডিও ফাইল নির্বাচন করুন";
    return;
  }

  button.disabled = true;
  status.textContent = "⏳ ভিডিও Upload হচ্ছে...";

  try {

    const formData = new FormData();
    formData.append("video", file);

    const response = await fetch(API_URL + "/upload", {
      method: "POST",
      body: formData
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Upload failed");
    }

    status.textContent = "✅ ভিডিও সফলভাবে Upload হয়েছে!";

    fileInput.value = "";

    if (data.id) {
      videos.unshift({
        id: data.id,
        title: file.name
      });

      renderVideos();
    }

  } catch (error) {

    console.error(error);

    status.textContent =
      "❌ Upload ব্যর্থ: " + error.message;

  } finally {

    button.disabled = false;

  }
}

function renderVideos() {

  const box = document.getElementById("videos");

  box.innerHTML = "";

  videos.forEach(video => {

    const div = document.createElement("div");

    div.className = "video";

    div.innerHTML = `
      <iframe
        src="https://iframe.mediadelivery.net/embed/${LIBRARY_ID}/${video.id}"
        loading="lazy"
        allow="accelerometer; gyroscope; autoplay; encrypted-media; picture-in-picture;"
        allowfullscreen>
      </iframe>

      <div class="title">
        ${escapeHtml(video.title)}
      </div>
    `;

    box.appendChild(div);

  });
}

function escapeHtml(text) {

  const div = document.createElement("div");

  div.textContent = text;

  return div.innerHTML;
}

renderVideos();

</script></body>
</html>
